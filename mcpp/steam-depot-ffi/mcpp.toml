# C ABI over cauth_steam_depot.
[package]
namespace = "cauth"
name      = "steam-depot-ffi"

[targets.cauth_steam_depot_ffi]
kind = "shared"

[build]
sources = ["../../src/ffi/steam_depot.cpp"]
defines = ["CAUTH_BUILD_SHARED=1"]

[dependencies]
cauth.core     = { path = "../core" }
cauth.core-ffi = { path = "../core-ffi" }
cauth.steam-auth  = { path = "../steam-auth" }
cauth.steam-depot = { path = "../steam-depot" }
